name: Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # This is a separate preview app. Keep its signing identity between CI runs.
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.local/share/reverse-platformer/preview-debug.keystore
          key: reverse-platformer-preview-debug-signing-v1

      - name: Prepare preview signing key
        shell: bash
        run: |
          STORE="$HOME/.local/share/reverse-platformer/preview-debug.keystore"
          mkdir -p "$(dirname "$STORE")"
          if [ ! -f "$STORE" ]; then
            keytool -genkeypair -noprompt -keystore "$STORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Reverse Platformer Preview,O=FulTech Studios,C=HU"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$STORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Generate original Blender models
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          mkdir -p assets/models build/blender
          blender --background --factory-startup --python tools/blender/generate_art.py -- --output assets/models --source build/blender 2>&1 | tee blender.log
          test -s assets/models/villain_knight.glb
          test -s assets/models/fortress_gate.glb
          test -s assets/models/courtyard_environment.glb
          blender --background --factory-startup --python tools/blender/generate_enemies.py -- --output assets/models --source build/blender 2>&1 | tee -a blender.log
          for kind in guard scout brute archer captain; do
            test -s "assets/models/enemy_${kind}.glb"
          done

      - name: Upload editable Blender sources and GLBs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-art-source-and-models
          path: |
            build/blender/*.blend
            assets/models/*.glb
          if-no-files-found: warn
          retention-days: 30

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android Debug
          archive_output: false
          export_debug: true
          cache: true

      - name: Find APK
        id: apk
        shell: bash
        run: |
          echo "Godot build directory: ${{ steps.export.outputs.build_directory }}"
          APK="$(find "${{ steps.export.outputs.build_directory }}" -type f -name "*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK produced."
            find "${{ steps.export.outputs.build_directory }}" -maxdepth 4 -type f -print || true
            exit 1
          fi
          mkdir -p artifact
          cp "$APK" artifact/ReversePlatformer-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReversePlatformer-debug-apk
          path: artifact/ReversePlatformer-debug.apk
          if-no-files-found: error

      - name: Test Blender assets in Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          if [ -z "$GODOT" ]; then
            echo "Godot executable not found"
            exit 1
          fi
          "$GODOT" --headless --path . --script res://tests/art_smoke.gd 2>&1 | tee art-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' art-smoke.log; then
            exit 1
          fi

      - name: Smoke test first level
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          if [ -z "$GODOT" ]; then
            echo "Godot executable not found"
            exit 1
          fi
          "$GODOT" --headless --path . --quit-after 30 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' godot-smoke.log; then
            exit 1
          fi

      - name: Test level progression and obstacles
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          "$GODOT" --headless --path . --script res://tests/stage_smoke.gd 2>&1 | tee stage-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' stage-smoke.log; then
            exit 1
          fi

      - name: Capture gameplay previews
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          timeout 90s xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/preview_capture.gd 2>&1 | tee preview.log
          if grep -E 'SCRIPT ERROR|ERROR:' preview.log; then
            exit 1
          fi

      - name: Upload gameplay previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-previews
          path: previews/*.png
          if-no-files-found: warn


      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: |
            blender.log
            art-smoke.log
            godot-smoke.log
            stage-smoke.log
            preview.log
          if-no-files-found: warn
          retention-days: 14
