name: Android Debug APK

on:
  push:
    branches: [ "main", "art/blender-knight-study" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Optimize courtyard runtime
        shell: bash
        run: |
          if ! python3 tools/verify_courtyard_runtime.py; then
            curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
            tar -xf /tmp/blender.tar.xz -C /tmp
            /tmp/blender-4.5.3-linux-x64/blender --background --python tools/blender/optimize_courtyard.py
            test -f art/source/world/runtime_optimization.json
          fi

      - name: Upload optimized courtyard
        uses: actions/upload-artifact@v4
        with:
          name: optimized-courtyard-runtime
          path: |
            assets/models/courtyard_environment.gltf
            assets/models/courtyard_environment_part*.bin
            art/source/world/runtime_optimization.json
          if-no-files-found: error

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # This is a separate preview app. Keep its signing identity between CI runs.
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.local/share/reverse-platformer/preview-debug.keystore
          key: reverse-platformer-preview-debug-signing-v1

      - name: Prepare preview signing key
        shell: bash
        run: |
          STORE="$HOME/.local/share/reverse-platformer/preview-debug.keystore"
          mkdir -p "$(dirname "$STORE")"
          if [ ! -f "$STORE" ]; then
            keytool -genkeypair -noprompt -keystore "$STORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Reverse Platformer Preview,O=FulTech Studios,C=HU"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$STORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android Debug
          archive_output: false
          export_debug: true
          cache: true

      - name: Find APK
        id: apk
        shell: bash
        run: |
          echo "Godot build directory: ${{ steps.export.outputs.build_directory }}"
          APK="$(find "${{ steps.export.outputs.build_directory }}" -type f -name "*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK produced."
            find "${{ steps.export.outputs.build_directory }}" -maxdepth 4 -type f -print || true
            exit 1
          fi
          mkdir -p artifact
          cp "$APK" artifact/ReversePlatformer-debug.apk
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$SIGNER" verify --verbose artifact/ReversePlatformer-debug.apk
          sha256sum artifact/ReversePlatformer-debug.apk | tee artifact/ReversePlatformer-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReversePlatformer-debug-apk
          path: |
            artifact/ReversePlatformer-debug.apk
            artifact/ReversePlatformer-debug.apk.sha256
          if-no-files-found: error

      # Also expose two small transfer archives for clients with a 32 MiB
      # single-file transfer ceiling. Concatenate part00.bin then part01.bin.
      - name: Prepare APK transfer parts
        shell: bash
        run: |
          mkdir -p artifact-parts
          split -n 2 -d --additional-suffix=.bin artifact/ReversePlatformer-debug.apk artifact-parts/ReversePlatformer.apk.part

      - name: Upload APK transfer part 1
        uses: actions/upload-artifact@v4
        with:
          name: ReversePlatformer-apk-part1
          path: artifact-parts/ReversePlatformer.apk.part00.bin
          if-no-files-found: error

      - name: Upload APK transfer part 2
        uses: actions/upload-artifact@v4
        with:
          name: ReversePlatformer-apk-part2
          path: artifact-parts/ReversePlatformer.apk.part01.bin
          if-no-files-found: error

      - name: Smoke test first level
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          if [ -z "$GODOT" ]; then
            echo "Godot executable not found"
            exit 1
          fi
          "$GODOT" --headless --path . --quit-after 30 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' godot-smoke.log; then
            exit 1
          fi

      - name: Test knight sword and Blender scenery
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          for TEST in knight_model_smoke world_art_smoke side_view_smoke; do
            timeout 120s "$GODOT" --headless --audio-driver Dummy --path . --script "res://tests/$TEST.gd" 2>&1 | tee "$TEST.log"
            if grep -E 'SCRIPT ERROR|ERROR:' "$TEST.log"; then exit 1; fi
            grep -q '_SMOKE_OK' "$TEST.log"
          done

      - name: Test level progression and obstacles
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          "$GODOT" --headless --path . --script res://tests/stage_smoke.gd 2>&1 | tee stage-smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' stage-smoke.log; then
            exit 1
          fi

      - name: Capture gameplay previews
        shell: bash
        run: |
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -maxdepth 1 -type f -name 'Godot*_linux.x86_64' -print -quit)"
          timeout 90s xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/preview_capture.gd 2>&1 | tee preview.log
          timeout 90s xvfb-run -a "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/feedback_preview.gd 2>&1 | tee -a preview.log
          if grep -E 'SCRIPT ERROR|ERROR:' preview.log; then
            exit 1
          fi

      - name: Upload gameplay previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-previews
          path: previews/*.png
          if-no-files-found: warn


      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: |
            godot-smoke.log
            stage-smoke.log
            knight_model_smoke.log
            world_art_smoke.log
            side_view_smoke.log
            preview.log
          if-no-files-found: warn
          retention-days: 14
